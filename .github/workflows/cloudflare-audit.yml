name: Cloudflare connection and R2 pilot diagnosis (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.github/workflows/cloudflare-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check connection, Worker switches, R2 pilot reservation without writing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          async function run(){
            const token=(process.env.CF_TOKEN||"").trim();
            if(!token){console.log("TOKEN_MISSING: add CLOUDFLARE_API_TOKEN to repository secrets"); process.exitCode=2;return}
            if(!/^[A-Za-z0-9_-]{25,200}$/.test(token)){console.log("TOKEN_FORMAT_INVALID: GitHub secret must contain ONLY the token value, not a curl command, Bearer prefix or quotation marks");process.exitCode=2;return}
            async function api(path){
              const r=await fetch("https://api.cloudflare.com/client/v4"+path,{
                headers:{"Authorization":"Bearer "+token,"Accept":"application/json"}
              });
              const text=await r.text();
              let json={};try{json=JSON.parse(text)}catch{}
              const errors=(json.errors||[]).map(e=>({code:e.code,message:String(e.message||"").slice(0,140)}));
              return {ok:r.ok && json.success===true,status:r.status,result:json.result,errors}
            }
            const verify=await api("/user/tokens/verify");
            console.log("TOKEN_VERIFY",JSON.stringify({ok:verify.ok,status:verify.status}));
            if(!verify.ok){console.log("TOKEN_VERIFY_ERRORS",JSON.stringify(verify.errors));process.exitCode=3;return}
            let account=process.env.CF_ACCOUNT_ID;
            if(!account){
              const accounts=await api("/accounts?per_page=50");
              if(!accounts.ok){console.log("ACCOUNT_DISCOVERY_FAILED",JSON.stringify({status:accounts.status,errors:accounts.errors}));process.exitCode=4;return}
              const values=Array.isArray(accounts.result)?accounts.result:[];
              console.log("ACCOUNT_COUNT",values.length);
              if(values.length!==1){console.log("ACCOUNT_ID_NEEDED: more than one or zero accessible accounts; add CLOUDFLARE_ACCOUNT_ID secret");process.exitCode=4;return}
              account=values[0].id;
            }
            if(!/^[0-9a-f]{32}$/i.test(account)){console.log("INVALID_ACCOUNT_ID");process.exitCode=5;return}
            const script="svari-aplinka-photos";
            const settings=await api("/accounts/"+account+"/workers/scripts/"+script+"/settings");
            console.log("WORKER_SETTINGS",JSON.stringify({ok:settings.ok,status:settings.status,errors:settings.errors}));
            if(settings.ok){
              const binds=settings.result?.bindings||[];
              console.log("WORKER_BINDINGS",JSON.stringify(binds.map(b=>({name:b.name,type:b.type,
                state: b.name==="ENABLE_UPLOADS"||b.name==="PILOT_ENABLED"?
                  (b.text==="true"?"ON":b.text==="false"?"OFF":"unknown"):undefined}))));
              // Never output any other binding's text or secrets.
            }
            const deployment=await api("/accounts/"+account+"/workers/scripts/"+script+"/deployments");
            console.log("WORKER_DEPLOYMENTS",JSON.stringify({ok:deployment.ok,status:deployment.status,
             count:(deployment.result?.deployments||[]).length,errors:deployment.errors}));
            const settings2=await api("/accounts/"+account+"/workers/scripts/"+script+"/script-settings");
            console.log("WORKER_OBSERVABILITY",JSON.stringify({ok:settings2.ok,status:settings2.status,
             enabled:settings2.result?.observability?.enabled===true,errors:settings2.errors}));
            const objects=await api("/accounts/"+account+"/r2/buckets/svari-aplinka-foto/objects?prefix=__sa_pilot_guard__%2F");
            console.log("R2_PILOT_GUARD",JSON.stringify({ok:objects.ok,status:objects.status,
             claimExists:objects.ok&&Array.isArray(objects.result?.objects)&&objects.result.objects.some(o=>o.key==="__sa_pilot_guard__/one-photo-v1"),
             objectCount:objects.ok?(objects.result?.objects||[]).length:undefined,errors:objects.errors}));
            if(!settings.ok||!objects.ok)process.exitCode=6;
          }
          run().catch(()=>{console.log("AUDIT_FAILED: check token secret format or Cloudflare connectivity (no secrets logged)");process.exitCode=7});
          JS
