name: Cloudflare one-photo 500 error log (READ ONLY)
on:
  push:
    branches: [main]
    paths: [.github/workflows/cloudflare-500-log.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query past Worker telemetry without changing data
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'JS'
          async function main(){
            const raw=(process.env.CF_TOKEN_RAW||"").trim();
            const token=/^[A-Za-z0-9_-]{25,200}$/.test(raw)?raw:(/Bearer\s+([A-Za-z0-9_-]{25,200})/i.exec(raw)?.[1]);
            if(!token){console.log("TOKEN_MISSING_OR_UNSUPPORTED");process.exitCode=2;return}
            const call=async(path,method="GET",payload)=>{
              const r=await fetch("https://api.cloudflare.com/client/v4"+path,{
                method,headers:{"authorization":"Bearer "+token,"content-type":"application/json"},
                body:payload?JSON.stringify(payload):undefined
              });
              const obj=await r.json().catch(()=>({}));
              return {status:r.status,success:obj.success,result:obj.result,errors:(obj.errors||[]).map(e=>({code:e.code,message:String(e.message||"").slice(0,170)}))};
            };
            let id=(process.env.CF_ACCOUNT_ID||"").trim();
            if(!id){
              const a=await call("/accounts?per_page=50");
              const accounts=Array.isArray(a.result)?a.result:[];
              if(!a.success||accounts.length!==1){console.log("ACCOUNT_NOT_RESOLVED");process.exitCode=2;return}
              id=accounts[0].id;
            }
            if(!/^[0-9a-f]{32}$/i.test(id))throw Error("Invalid account id");
            const payload={
              queryId:"r2-photo-live-upload-last4h",
              timeframe:{from:Date.now()-4*3600*1000,to:Date.now()+60*1000},
              parameters:{
                datasets:["cloudflare-workers"],
                filters:[],
                limit:40
              },view:"events",limit:80,dry:false
            };
            const r=await call("/accounts/"+id+"/workers/observability/telemetry/query","POST",payload);
            console.log("TELEMETRY_QUERY",{status:r.status,success:r.success,errors:r.errors});
            if(!r.success){process.exitCode=3;return}
            const events=Array.isArray(r.result?.events?.events)?r.result.events.events:[];
            console.log("RESULT_SHAPE",Array.isArray(r.result)?"array":Object.keys(r.result||{}));
            console.log("MATCHED_EVENTS",events.length);
            // Never dump raw requests, JWT, query parameters, addresses, or metadata bodies.
            for(const item of events.slice(0,80)){
              const meta=item?.$metadata||item?.metadata||{};
              const workers=meta?.$workers||meta?.workers||{};
              const status=meta?.statusCode||workers?.event?.response?.status||"unknown";
              const msg=String(meta?.error||meta?.errorTemplate||"");
              const errorType=/\b(TypeError|ReferenceError|RangeError|R2Error|FetchError|InternalError)\b/.exec(msg)?.[0]||"not_classified";
              const names=Object.keys(meta||{}).filter(k=>/^(?:$metadata|error|message|level|source|status|stage)$/.test(k));
              const service=String(meta?.service||"");
              if(service==="svari-aplinka-photos"){
                const src=JSON.stringify(item?.source||"");
                const stage=/\\\"stage\\\"\\s*:\\s*\\\"([A-Z_]+)\\\"/.exec(src)?.[1]||"";
                const workerError=/R2_UPLOAD_UNEXPECTED|WORKER_EXCEPTION|R2_HEALTH_UNAVAILABLE/.exec(src)?.[0]||"";
                const detail=String(meta.message||"");
                const msgText=String(item?.source?.message||"");
                const safeLabels=["R2_UPLOAD_REQUEST_RESULT","R2_UPLOAD_REJECTED","R2_UPLOAD_UNEXPECTED","R2_WORKER_UNEXPECTED","R2_HEALTH_UNAVAILABLE"];
                const diag=safeLabels.find(x=>msgText.includes(x))||"";
                if(diag){
                  const statusTag=/\\b(?:status|statusCode)[^0-9]{1,8}(400|401|403|404|409|413|415|422|429|500|502|503)\\b/.exec(msgText)?.[1]||"";
                  const codeTag=/\\b(INTERNAL_ERROR|DATABASE_CHECK_FAILED|NO_MEMBERSHIP|AUTH_INVALID|ADMIN_ONLY|NOT_CONFIGURED|CONFIG_MISMATCH|UPLOAD_[A-Z_]+_FAILED|R2_[A-Z_]+|PHOTO_LIMIT|JOB_UNAVAILABLE|INVALID_ID)\\b/.exec(msgText)?.[1]||"";
                  const typeTag=/\\b(TypeError|ReferenceError|RangeError|SyntaxError|Error)\\b/.exec(msgText)?.[1]||"";
                  console.log("DIAGNOSTIC",{at:new Date(item.timestamp).toISOString(),diag,statusTag,codeTag,typeTag,
                    safeSource:Object.fromEntries(Object.entries(item?.source||{}).filter(([k,v])=>
                       ["status","code","errorType","stage"].includes(k)&&
                       (typeof v==="number"||(typeof v==="string"&&v.length<80&&/^[A-Za-z0-9_ -]+$/.test(v))))
                    )});
                }
                const responseCode=Number(meta.statusCode||0);
                if(meta.level==="error"||responseCode>=400)
                   console.log("ERROR_EVENT",JSON.stringify({at:new Date(item.timestamp).toISOString(),responseCode,workerError,stage,sourceKeys:Object.keys(item?.source||{}),sourceMessageType:typeof item?.source?.message,sourceMessagePreview:String(item?.source?.message||"").replace(/[0-9a-f]{8}-[0-9a-f-]{27,40}/gi,"[uuid]").replace(/Bearer\\s+\\S+/gi,"Bearer [redacted]").slice(0,150),messageKind: detail.startsWith("R2_")?detail.slice(0,48):"other"}));
              }
            }
          }
          main().catch(e=>{console.log("LOG_QUERY_FAILED",String(e?.message||"error").slice(0,120));process.exitCode=4});
          JS
